<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>금정산 초정밀 음영기복도(Hillshade) 0.5m COG 뷰어</title>
  
  <!-- 1. GeoTIFF 전역 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/geotiff@2.1.3/dist-browser/geotiff.js"></script>
  
  <!-- 2. Proj4js 좌표계 정의 라이브러리 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>

  <!-- 3. OpenLayers 8.2 공식 UMD 번들 및 스타일 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v8.2.0/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/ol@v8.2.0/dist/ol.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Pretendard", sans-serif;
      background-color: #1a1a1a;
      color: #1f2937;
    }
    #map {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* 플로팅 컨트롤 패널 */
    .control-panel {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      padding: 16px 18px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.9);
      max-width: 360px;
      width: calc(100vw - 28px);
      transition: all 0.3s ease;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .panel-title {
      font-size: 15px;
      font-weight: 800;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      font-size: 10.5px;
      font-weight: 700;
      background: #0284c7;
      color: #ffffff;
      padding: 2px 8px;
      border-radius: 12px;
    }
    .panel-sub {
      font-size: 11px;
      color: #64748b;
      line-height: 1.4;
      margin-bottom: 12px;
    }

    .section-divider {
      height: 1px;
      background: #e2e8f0;
      margin: 10px 0;
    }

    /* 프리셋 모드 선택 버튼 */
    .preset-label {
      font-size: 11.5px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    .preset-group {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 5px;
      margin-bottom: 10px;
    }
    .btn-preset {
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      padding: 7px 4px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 700;
      color: #475569;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .btn-preset.active {
      background: #0f172a;
      color: #ffffff;
      border-color: #0f172a;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.25);
    }

    /* 슬라이더 컨트롤 */
    .slider-header {
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 6px;
    }
    .slider-val {
      color: #0284c7;
      font-weight: 800;
    }
    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #e2e8f0;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #0284c7;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.25);
    }

    /* 하단 액션 버튼 */
    .btn-action {
      width: 100%;
      background: #0284c7;
      color: #ffffff;
      border: none;
      padding: 9px 0;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn-action:hover {
      background: #0369a1;
    }

    /* 로딩 인디케이터 */
    #loader {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2000;
      background: rgba(15, 23, 42, 0.94);
      color: #ffffff;
      padding: 20px 28px;
      border-radius: 14px;
      font-size: 13.5px;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.15);
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3.5px solid rgba(255, 255, 255, 0.25);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 모바일 레이아웃 대응 */
    @media (max-width: 480px) {
      .control-panel {
        top: auto;
        bottom: 14px;
        left: 14px;
        width: calc(100vw - 28px);
        max-width: none;
        padding: 14px 16px;
      }
    }
  </style>
</head>
<body>

  <!-- 지도 캔버스 -->
  <div id="map"></div>

  <!-- 로딩 스피너 -->
  <div id="loader">
    <div class="spinner"></div>
    <div id="loader-text">지형 데이터 스트리밍 연결 중...</div>
  </div>

  <!-- 컨트롤 대시보드 -->
  <div class="control-panel">
    <div class="panel-header">
      <div class="panel-title">
        <span>🏔️ 금정산 음영기복도</span>
      </div>
      <span class="badge">0.5m COG</span>
    </div>
    <div class="panel-sub">
      QGIS Singleband Gray 1:1 정합 심볼로지<br/>
      좌표계: UTM-52N (EPSG:32652) · 16-bit GeoTIFF
    </div>

    <div class="section-divider"></div>

    <!-- 뷰어 모드 프리셋 -->
    <div class="preset-label">
      <span>🎨 시각화 모드 프리셋</span>
    </div>
    <div class="preset-group">
      <button class="btn-preset active" data-mode="qgis">QGIS 지형</button>
      <button class="btn-preset" data-mode="satellite">위성 입체</button>
      <button class="btn-preset" data-mode="osm">일반지도</button>
    </div>

    <!-- 음영기복도 투명도 조절 -->
    <div class="slider-header">
      <span>지형 음영 투명도</span>
      <span id="opacity-val" class="slider-val">100%</span>
    </div>
    <input type="range" id="opacity-slider" min="0" max="100" value="100" />

    <!-- 전체 줌 리셋 버튼 -->
    <button class="btn-action" id="btn-reset-view">🎯 금정산 전체 영역 맞춤</button>
  </div>

  <script>
    // 1. EPSG:32652 (UTM zone 52N) 투영계 등록 (GPU 네이티브 파이프라인)
    proj4.defs("EPSG:32652", "+proj=utm +zone=52 +datum=WGS84 +units=m +no_defs");
    ol.proj.proj4.register(proj4);

    // 2. GCS 버킷 내 0.5m COG GeoTIFF 소스 정의 (0.0~32765.0 명시적 정규화)
    const cogUrl = 'https://storage.googleapis.com/researchins/GJS_DEM_Hillshade_202603_cog.tif';
    
    const cogSource = new ol.source.GeoTIFF({
      sources: [{
        url: cogUrl,
        nodata: -32768.0,
        min: 0.0,
        max: 32765.0
      }]
    });

    // 3. QGIS Singleband Gray 1:1 일치 셰이더 (0.0: Black ~ 0.47: Gray ~ 1.0: White)
    const hillshadeLayer = new ol.layer.WebGLTile({
      source: cogSource,
      opacity: 1.0,
      style: {
        color: [
          'interpolate',
          ['linear'],
          ['band', 1],
          0.00, [0, 0, 0, 1],         // QGIS Min (0.0): 깊은 그림자 (Black)
          0.47, [145, 145, 150, 1],   // QGIS Median (15458): 중간톤 사면 (Gray)
          1.00, [255, 255, 255, 1]    // QGIS Max (32765.0): 양지 능선 (White)
        ]
      }
    });

    // 4. 배경 지도 레이어 정의 (초기 QGIS 지형 모드: 모두 비활성화)
    const osmLayer = new ol.layer.Tile({
      source: new ol.source.OSM(),
      visible: false
    });

    const satelliteLayer = new ol.layer.Tile({
      source: new ol.source.XYZ({
        url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        maxZoom: 19
      }),
      visible: false
    });

    // 5. 오픈레이어스 맵 인스턴스 초기화 (cogSource.getView()로 네이티브 UTM-52N 직결)
    const map = new ol.Map({
      target: 'map',
      layers: [
        osmLayer,
        satelliteLayer,
        hillshadeLayer
      ],
      view: cogSource.getView()
    });

    // 6. 비동기 뷰 로드 완료 처리
    let cachedViewOptions = null;
    cogSource.getView().then(viewOptions => {
      cachedViewOptions = viewOptions;
      document.getElementById('loader').style.display = 'none';
      console.log('✅ 네이티브 UTM-52N 뷰 로드 완료:', viewOptions);
    }).catch(err => {
      console.warn('GeoTIFF getView 로드 안내:', err);
      document.getElementById('loader').style.display = 'none';
    });

    // 7. 무한 로딩 방지 안전 타이머 (2초 후 로더 자동 숨김)
    setTimeout(() => {
      const loader = document.getElementById('loader');
      if (loader) loader.style.display = 'none';
    }, 2000);

    // 8. 인터랙티브 이벤트 제어
    const opacitySlider = document.getElementById('opacity-slider');
    const opacityVal = document.getElementById('opacity-val');

    // (1) 투명도 슬라이더 연동
    opacitySlider.addEventListener('input', (e) => {
      const val = e.target.value;
      opacityVal.innerText = `${val}%`;
      hillshadeLayer.setOpacity(val / 100);
    });

    // (2) 프리셋 모드 전환 (QGIS 지형 / 위성 입체 / 일반지도)
    const presetBtns = document.querySelectorAll('.btn-preset');
    presetBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        presetBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const mode = btn.getAttribute('data-mode');

        if (mode === 'qgis') {
          satelliteLayer.setVisible(false);
          osmLayer.setVisible(false);
          hillshadeLayer.setOpacity(1.0);
          opacitySlider.value = 100;
          opacityVal.innerText = '100%';
        } else if (mode === 'satellite') {
          satelliteLayer.setVisible(true);
          osmLayer.setVisible(false);
          hillshadeLayer.setOpacity(0.70);
          opacitySlider.value = 70;
          opacityVal.innerText = '70%';
        } else if (mode === 'osm') {
          satelliteLayer.setVisible(false);
          osmLayer.setVisible(true);
          hillshadeLayer.setOpacity(0.60);
          opacitySlider.value = 60;
          opacityVal.innerText = '60%';
        }
      });
    });

    // (3) 전체 영역 맞춤 리셋
    document.getElementById('btn-reset-view').addEventListener('click', () => {
      if (cachedViewOptions && cachedViewOptions.extent) {
        map.getView().fit(cachedViewOptions.extent, { duration: 800 });
      }
    });
  </script>
</body>
</html>
