<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COG Raster Viewer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v8.2.0/ol.css">
  <style>
    body, html, #map { margin: 0; padding: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- ES Module 방식으로 OpenLayers 직접 로드 -->
  <script type="module">
    import Map from 'https://cdn.jsdelivr.net/npm/ol@v8.2.0/Map.js';
    import View from 'https://cdn.jsdelivr.net/npm/ol@v8.2.0/View.js';
    import TileLayer from 'https://cdn.jsdelivr.net/npm/ol@v8.2.0/layer/Tile.js';
    import WebGLTileLayer from 'https://cdn.jsdelivr.net/npm/ol@v8.2.0/layer/WebGLTile.js';
    import OSM from 'https://cdn.jsdelivr.net/npm/ol@v8.2.0/source/OSM.js';
    import GeoTIFF from 'https://cdn.jsdelivr.net/npm/ol@v8.2.0/source/GeoTIFF.js';

    const cogSource = new GeoTIFF({
      sources: [{
        // 실제 GCS 버킷의 파일명으로 수정하세요
        url: 'https://storage.googleapis.com/researchins/GJS_DEM_Merge_202603_cog.tif'
      }]
    });

    const map = new Map({
      target: 'map',
      layers: [
        new TileLayer({
          source: new OSM()
        }),
        new WebGLTileLayer({
          source: cogSource
        })
      ],
      view: new View({
        center: [0, 0],
        zoom: 2
      })
    });

    // COG 메타데이터를 파싱하여 해당 래스터 영역으로 자동 줌/이동
    cogSource.getView().then(viewOptions => {
      map.setView(new View(viewOptions));
    }).catch(err => {
      console.error("COG 로딩 에러:", err);
    });
  </script>
</body>
</html>
