<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>금정산 초정밀 음영기복도(Hillshade) COG 뷰어 (0.5m / 5m)</title>
  
  <!-- 1. GeoTIFF 전역 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/geotiff@2.1.3/dist-browser/geotiff.js"></script>
  
  <!-- 2. Proj4js 좌표계 정의 라이브러리 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>

  <!-- 3. OpenLayers 8.2 공식 UMD 번들 및 스타일 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v8.2.0/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/ol@v8.2.0/dist/ol.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Pretendard", sans-serif;
      background-color: #111827;
      color: #1f2937;
    }
    #map {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* 플로팅 컨트롤 패널 (좌측 상단) */
    .control-panel {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      padding: 14px 16px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.9);
      max-width: 350px;
      width: calc(100vw - 28px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
    }
    .panel-title-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .panel-title {
      font-size: 14.5px;
      font-weight: 800;
      color: #0f172a;
    }
    .badge {
      font-size: 10px;
      font-weight: 700;
      background: #0284c7;
      color: #ffffff;
      padding: 2px 7px;
      border-radius: 10px;
      transition: background 0.3s;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-toggle {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 11px;
      color: #475569;
      transition: all 0.2s ease;
    }
    .btn-toggle:hover {
      background: #e2e8f0;
      color: #0f172a;
    }

    /* 패널 바디 (접기/펼치기 애니메이션) */
    .panel-body {
      max-height: 600px;
      opacity: 1;
      overflow: hidden;
      transition: max-height 0.35s ease, opacity 0.3s ease, margin-top 0.3s ease;
      margin-top: 10px;
    }

    .control-panel.collapsed .panel-body {
      max-height: 0;
      opacity: 0;
      margin-top: 0;
      pointer-events: none;
    }

    .control-panel.collapsed .btn-toggle {
      transform: rotate(180deg);
      background: #0284c7;
      color: #ffffff;
      border-color: #0284c7;
    }

    .panel-sub {
      font-size: 11px;
      color: #64748b;
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .section-divider {
      height: 1px;
      background: #e2e8f0;
      margin: 9px 0;
    }

    /* 해상도 스위처 그룹 */
    .section-label {
      font-size: 11.5px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .res-switch-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      margin-bottom: 8px;
    }
    .btn-res {
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      padding: 7px 4px;
      border-radius: 7px;
      font-size: 11.5px;
      font-weight: 700;
      color: #475569;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .btn-res.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #0284c7;
      box-shadow: 0 2px 6px rgba(2, 132, 199, 0.3);
    }

    /* 프리셋 모드 선택 버튼 */
    .preset-group {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 5px;
      margin-bottom: 8px;
    }
    .btn-preset {
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      padding: 7px 4px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 700;
      color: #475569;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .btn-preset.active {
      background: #0f172a;
      color: #ffffff;
      border-color: #0f172a;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.25);
    }

    /* 슬라이더 컨트롤 */
    .slider-header {
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 6px;
    }
    .slider-val {
      color: #0284c7;
      font-weight: 800;
    }
    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #e2e8f0;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #0284c7;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.25);
    }

    /* 하단 액션 버튼 */
    .btn-action {
      width: 100%;
      background: #0284c7;
      color: #ffffff;
      border: none;
      padding: 9px 0;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn-action:hover {
      background: #0369a1;
    }

    /* 로딩 인디케이터 */
    #loader {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2000;
      background: rgba(15, 23, 42, 0.94);
      color: #ffffff;
      padding: 20px 28px;
      border-radius: 14px;
      font-size: 13.5px;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.15);
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3.5px solid rgba(255, 255, 255, 0.25);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* OpenLayers 기본 줌 컨트롤(+/-) 위치를 우측 상단으로 이동 및 모던 스타일링 */
    .ol-zoom {
      top: 14px;
      right: 14px;
      left: auto;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      padding: 4px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.9);
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 1000;
    }
    .ol-zoom button {
      background: #f8fafc;
      color: #0f172a;
      font-size: 16px;
      font-weight: 800;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      margin: 0 !important;
      outline: none;
    }
    .ol-zoom button:hover {
      background: #0284c7;
      color: #ffffff;
      border-color: #0284c7;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.35);
    }
    .ol-zoom button:active {
      transform: scale(0.95);
    }

    /* 모바일 레이아웃 대응 */
    @media (max-width: 480px) {
      .control-panel {
        top: 10px;
        left: 10px;
        width: calc(100vw - 20px);
        max-width: none;
        padding: 12px 14px;
      }
      .ol-zoom {
        top: auto;
        bottom: 24px;
        right: 14px;
      }
    }
  </style>
</head>
<body>

  <!-- 지도 캔버스 -->
  <div id="map"></div>

  <!-- 로딩 스피너 -->
  <div id="loader">
    <div class="spinner"></div>
    <div id="loader-text">지형 데이터 스트리밍 연결 중...</div>
  </div>

  <!-- 접이식 컨트롤 대시보드 (좌측 상단) -->
  <div class="control-panel" id="control-panel">
    <!-- 헤더 (클릭 시 접기/펼치기 토글) -->
    <div class="panel-header" id="panel-toggle-header" title="메뉴 접기/펼치기">
      <div class="panel-title-wrap">
        <span class="panel-title">🏔️ 금정산 음영기복도</span>
        <span class="badge" id="badge-res">0.5m COG</span>
      </div>
      <div class="header-actions">
        <button class="btn-toggle" id="btn-toggle" aria-label="메뉴 접기">▲</button>
      </div>
    </div>

    <!-- 접히는 바디 영역 -->
    <div class="panel-body">
      <div class="panel-sub">
        QGIS Singleband Gray 1:1 정합 심볼로지<br/>
        좌표계: UTM-52N (EPSG:32652) · 16-bit GeoTIFF
      </div>

      <!-- 1. 해상도 선택 스위처 -->
      <div class="section-label">
        <span>🛰️ 음영기복도 해상도 선택</span>
        <span id="res-status-tag" style="color: #0284c7; font-size: 10.5px; font-weight: 700;">0.5m 초고정밀</span>
      </div>
      <div class="res-switch-group">
        <button class="btn-res active" data-res="0.5m">0.5m 초고정밀 (광역)</button>
        <button class="btn-res" data-res="5m">5m 일반음영 (국소)</button>
      </div>

      <div class="section-divider"></div>

      <!-- 2. 뷰어 모드 프리셋 -->
      <div class="section-label">
        <span>🎨 시각화 모드 프리셋</span>
      </div>
      <div class="preset-group">
        <button class="btn-preset active" data-mode="qgis">QGIS 지형</button>
        <button class="btn-preset" data-mode="satellite">위성 입체</button>
        <button class="btn-preset" data-mode="osm">일반지도</button>
      </div>

      <!-- 3. 음영기복도 투명도 조절 -->
      <div class="slider-header">
        <span>지형 음영 투명도</span>
        <span id="opacity-val" class="slider-val">100%</span>
      </div>
      <input type="range" id="opacity-slider" min="0" max="100" value="100" />

      <!-- 4. 전체 줌 리셋 버튼 -->
      <button class="btn-action" id="btn-reset-view">🎯 금정산 중심부 맞춤</button>
    </div>
  </div>

  <script>
    // 1. EPSG:32652 (UTM zone 52N) 투영계 등록 (GPU 네이티브 직결)
    proj4.defs("EPSG:32652", "+proj=utm +zone=52 +datum=WGS84 +units=m +no_defs");
    ol.proj.proj4.register(proj4);

    // 2. GCS 버킷 내 0.5m 및 5m COG GeoTIFF 소스 정의
    const cogUrl05 = 'https://storage.googleapis.com/researchins/GJS_DEM_Hillshade_202603_cog.tif';
    const cogUrl5m = 'https://storage.googleapis.com/researchins/GJS_DEM_Hillshade_202603_5m_cog.tif';
    
    // (1) 0.5m COG 소스 (Float32)
    const cogSource05 = new ol.source.GeoTIFF({
      sources: [{
        url: cogUrl05,
        nodata: -32768.0,
        min: 0.0,
        max: 32765.0
      }]
    });

    // (2) 5m COG 소스 (Float32)
    const cogSource5m = new ol.source.GeoTIFF({
      sources: [{
        url: cogUrl5m,
        nodata: -32768.0,
        min: 0.0,
        max: 32761.0
      }]
    });

    // 3. QGIS Singleband Gray 1:1 일치 셰이더 (0.0: Black ~ 0.47: Gray ~ 1.0: White)
    const hillshadeStyle = {
      color: [
        'interpolate',
        ['linear'],
        ['band', 1],
        0.00, [0, 0, 0, 1],         // 깊은 그림자: 완전한 블랙
        0.47, [145, 145, 150, 1],   // 중간 지형 사면: 내추럴 그레이
        1.00, [255, 255, 255, 1]    // 밝은 능선/정상부: 선명한 화이트
      ]
    };

    // 0.5m WebGL 레이어 (기본 활성화)
    const hillshade05Layer = new ol.layer.WebGLTile({
      source: cogSource05,
      opacity: 1.0,
      visible: true,
      style: hillshadeStyle
    });

    // 5m WebGL 레이어 (기본 비활성화)
    const hillshade5mLayer = new ol.layer.WebGLTile({
      source: cogSource5m,
      opacity: 1.0,
      visible: false,
      style: hillshadeStyle
    });

    let currentRes = '0.5m';
    let currentHillshadeLayer = hillshade05Layer;

    // 4. 배경 지도 레이어 정의 (초기 QGIS 지형 모드: 모두 비활성화)
    const osmLayer = new ol.layer.Tile({
      source: new ol.source.OSM(),
      visible: false
    });

    const satelliteLayer = new ol.layer.Tile({
      source: new ol.source.XYZ({
        url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        maxZoom: 19
      }),
      visible: false
    });

    // 5. 오픈레이어스 맵 인스턴스 초기화 (cogSource05 뷰 기반)
    const map = new ol.Map({
      target: 'map',
      layers: [
        osmLayer,
        satelliteLayer,
        hillshade05Layer,
        hillshade5mLayer
      ],
      view: cogSource05.getView()
    });

    // 6. 비동기 뷰 로드 시 디지털 초정밀 확대(maxZoom: 10) 적용
    const center05 = [503714.75, 3900021.25];
    const center5m = [505209.71, 3905525.95];

    cogSource05.getView().then(viewOptions => {
      map.setView(new ol.View({
        ...viewOptions,
        maxZoom: 10,           // 최대 줌 10단계까지 초근접 확대 허용
        minResolution: 0.03,   // 3cm급 해상도까지 세밀한 픽셀 확대 지원
        smoothExtentConstraint: true
      }));

      map.getView().setCenter(center05);
      map.getView().setZoom(4);
      document.getElementById('loader').style.display = 'none';
      console.log('✅ 0.5m & 5m 멀티 해상도 COG 뷰어 활성화 완료');
    }).catch(err => {
      console.warn('GeoTIFF getView 로드 안내:', err);
      document.getElementById('loader').style.display = 'none';
    });

    // 7. 무한 로딩 방지 안전 타이머
    setTimeout(() => {
      const loader = document.getElementById('loader');
      if (loader) loader.style.display = 'none';
    }, 2000);

    // 8. 인터랙티브 메뉴 접기/펼치기 제어
    const controlPanel = document.getElementById('control-panel');
    const toggleHeader = document.getElementById('panel-toggle-header');
    const btnToggle = document.getElementById('btn-toggle');

    function toggleMenu(e) {
      controlPanel.classList.toggle('collapsed');
      const isCollapsed = controlPanel.classList.contains('collapsed');
      btnToggle.innerText = isCollapsed ? '▼' : '▲';
      btnToggle.setAttribute('aria-label', isCollapsed ? '메뉴 펼치기' : '메뉴 접기');
    }

    toggleHeader.addEventListener('click', toggleMenu);

    // 9. 해상도 스위칭 (0.5m ↔ 5m) 제어 (클릭 시 자동 카메라 이동)
    const resBtns = document.querySelectorAll('.btn-res');
    const badgeRes = document.getElementById('badge-res');
    const resStatusTag = document.getElementById('res-status-tag');
    const opacitySlider = document.getElementById('opacity-slider');
    const opacityVal = document.getElementById('opacity-val');

    function switchResolution(res, autoPan = true) {
      currentRes = res;
      resBtns.forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-res') === res);
      });

      const currentOpacity = parseFloat(opacitySlider.value) / 100;

      if (res === '0.5m') {
        hillshade05Layer.setVisible(true);
        hillshade5mLayer.setVisible(false);
        currentHillshadeLayer = hillshade05Layer;
        badgeRes.innerText = '0.5m COG';
        resStatusTag.innerText = '0.5m 초고정밀';
        if (autoPan) {
          map.getView().animate({ center: center05, zoom: 4, duration: 600 });
        }
      } else {
        hillshade05Layer.setVisible(false);
        hillshade5mLayer.setVisible(true);
        currentHillshadeLayer = hillshade5mLayer;
        badgeRes.innerText = '5m COG';
        resStatusTag.innerText = '5m 일반음영';
        if (autoPan) {
          map.getView().animate({ center: center5m, zoom: 6, duration: 600 });
        }
      }

      currentHillshadeLayer.setOpacity(currentOpacity);
    }

    resBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const res = btn.getAttribute('data-res');
        switchResolution(res, true);
      });
    });

    // 10. 인터랙티브 이벤트 제어
    // (1) 투명도 슬라이더 연동
    opacitySlider.addEventListener('input', (e) => {
      const val = e.target.value;
      opacityVal.innerText = `${val}%`;
      currentHillshadeLayer.setOpacity(val / 100);
    });

    // (2) 프리셋 모드 전환 (QGIS 지형 / 위성 입체 / 일반지도)
    const presetBtns = document.querySelectorAll('.btn-preset');
    presetBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        presetBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const mode = btn.getAttribute('data-mode');

        if (mode === 'qgis') {
          satelliteLayer.setVisible(false);
          osmLayer.setVisible(false);
          currentHillshadeLayer.setOpacity(1.0);
          opacitySlider.value = 100;
          opacityVal.innerText = '100%';
        } else if (mode === 'satellite') {
          satelliteLayer.setVisible(true);
          osmLayer.setVisible(false);
          currentHillshadeLayer.setOpacity(0.70);
          opacitySlider.value = 70;
          opacityVal.innerText = '70%';
        } else if (mode === 'osm') {
          satelliteLayer.setVisible(false);
          osmLayer.setVisible(true);
          currentHillshadeLayer.setOpacity(0.60);
          opacitySlider.value = 60;
          opacityVal.innerText = '60%';
        }
      });
    });

    // (3) 전체 영역 맞춤 리셋
    document.getElementById('btn-reset-view').addEventListener('click', (e) => {
      e.stopPropagation();
      if (currentRes === '0.5m') {
        map.getView().animate({ center: center05, zoom: 4, duration: 500 });
      } else {
        map.getView().animate({ center: center5m, zoom: 6, duration: 500 });
      }
    });
  </script>
</body>
</html>
