<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>부산 Hillshade COG 뷰어</title>
  <link rel="stylesheet" href="https://esm.sh/ol@8.2.0/ol.css">
  <!-- 좌표계 정의 라이브러리 (proj4js) 추가 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
  <style>
    body, html, #map { margin: 0; padding: 0; width: 100%; height: 100%; }
    #loader {
      position: absolute; top: 10px; left: 10px; z-index: 1000;
      background: white; padding: 10px; border-radius: 4px; border: 1px solid #ccc;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="loader">데이터 위치로 이동 중...</div>

  <script type="module">
    import Map from 'https://esm.sh/ol@8.2.0/Map';
    import View from 'https://esm.sh/ol@8.2.0/View';
    import TileLayer from 'https://esm.sh/ol@8.2.0/layer/Tile';
    import WebGLTileLayer from 'https://esm.sh/ol@8.2.0/layer/WebGLTile';
    import OSM from 'https://esm.sh/ol@8.2.0/source/OSM';
    import GeoTIFF from 'https://esm.sh/ol@8.2.0/source/GeoTIFF';
    import { register } from 'https://esm.sh/ol@8.2.0/proj/proj4';

    // 1. [좌표계 해결] EPSG:32652 (UTM zone 52N) 명시적 정의 등록
    // 이 정의가 없으면 브라우저가 데이터의 위치를 찾지 못합니다.
    proj4.defs("EPSG:32652", "+proj=utm +zone=52 +datum=WGS84 +units=m +no_defs");
    register(proj4);

    // 2. COG 소스 설정 (Hillshade 파일)
    const cogSource = new GeoTIFF({
      sources: [{
        url: 'https://storage.googleapis.com/researchins/GJS_DEM_Merge_202603_cog.tif',
        nodata: -9999
      }]
    });

    // 3. [심볼 해결] Hillshade 데이터 0 ~ 32765 흑백 시각화 스타일
    const hillshadeLayer = new WebGLTileLayer({
      source: cogSource,
      style: {
        color: [
          'interpolate',
          ['linear'],
          ['band', 1],
          0,     [0, 0, 0, 1],       // 0 (가장 어두운 곳: 검은색)
          32765, [255, 255, 255, 1]  // 32765 (가장 밝은 곳: 흰색)
        ]
      },
      opacity: 0.9 // 배경 지도와 함께 보기 위해 약간 투명하게 설정
    });

    // 4. 지도 생성
    const map = new Map({
      target: 'map',
      layers: [
        new TileLayer({
          source: new OSM() // 배경 지도 (OpenStreetMap)
        }),
        hillshadeLayer
      ],
      // 기본 뷰는 데이터 로딩 전까지 전세계 지도를 보여줍니다.
      view: new View({
        center: [0, 0],
        zoom: 2
      })
    });

    // 5. [자동 이동] 데이터 메타데이터를 파싱하여 부산 실제 영역으로 이동
    cogSource.getView().then(viewOptions => {
      // viewOptions에는 EPSG:32652 기반의 영역과 투영 정보가 담겨 있습니다.
      map.setView(new View(viewOptions));
      document.getElementById('loader').style.display = 'none';
      console.log("데이터 로드 및 위치 이동 완료");
    }).catch(err => {
      console.error("COG 로딩 오류:", err);
      document.getElementById('loader').innerText = "로딩 오류!";
    });
  </script>
</body>
</html>
